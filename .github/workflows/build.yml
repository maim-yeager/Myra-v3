name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/myra_release.jks

      - name: Convert Keystore to compatible format
        run: |
          keytool -importkeystore \
            -srckeystore app/myra_release.jks \
            -srcstorepass "${{ secrets.STORE_PASSWORD }}" \
            -destkeystore app/myra_release_converted.jks \
            -deststorepass "${{ secrets.STORE_PASSWORD }}" \
            -deststoretype pkcs12 \
            -J-Dkeystore.pkcs12.legacy 2>/dev/null || \
          echo "Keystore conversion skipped (may already be compatible)"
          if [ -f app/myra_release_converted.jks ]; then
            mv app/myra_release_converted.jks app/myra_release.jks
          fi

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myra-ai-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
